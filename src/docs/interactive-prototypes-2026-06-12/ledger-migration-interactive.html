<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账套导入系统 - 交互原型</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}.page{min-height:100vh;padding:24px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:10px;box-shadow:0 12px 30px rgba(17,24,39,.06)}.btn{border:0;border-radius:8px;background:#7566f1;color:#fff;padding:10px 16px;cursor:pointer;font-weight:700}.btn.secondary{background:#eef2ff;color:#5145cd}.btn.ghost{background:#fff;color:#475467;border:1px solid #d8dee9}.tag{display:inline-flex;border-radius:999px;background:#eef2ff;color:#5145cd;padding:3px 9px;font-size:12px;font-weight:700}.muted{color:#667085}.grid{display:grid;gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{border:1px solid #d8dee9;border-radius:8px;padding:9px 10px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}th{background:#f8fafc;color:#475467}.status{font-weight:700}.ok{color:#0f9f6e}.warn{color:#d97706}.bad{color:#d92d20}.hero{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:center;min-height:100vh;background:linear-gradient(120deg,#eef2ff,#eaf7fb);padding:48px}.login{padding:28px}.stats{display:flex;gap:14px;margin-top:28px}.stat{background:#fff;border-radius:8px;padding:14px 18px;min-width:120px}.work{display:none}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.steps{display:flex;gap:8px;margin:16px 0}.step{flex:1;padding:10px;border-radius:8px;background:#eef2ff;color:#5145cd;text-align:center;font-size:13px}.step.active{background:#7566f1;color:#fff}.side{padding:18px}.main{padding:18px}.log{background:#101828;color:#e6edf3;border-radius:8px;padding:12px;height:120px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px}.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{border:1px solid #e4e8f0;border-radius:8px;padding:12px}.item input{margin-right:8px}@media(max-width:900px){.hero,.layout{grid-template-columns:1fr}.hero{padding:24px}} </style></head><body><section id="login" class="hero"><div><div class="tag">账套采集 · 数据导入 · 记录留痕</div><h1 style="font-size:44px;margin:18px 0 12px">账套导入系统</h1><p class="muted" style="font-size:17px;line-height:1.8;max-width:680px">采集源财务软件账套数据，并导入到新的财务软件账套。支持授权、异步采集、数据选择、导入确认和记录追溯。</p><div class="stats"><div class="stat"><b style="font-size:28px">2</b><br><span class="muted">支持财务软件</span></div><div class="stat"><b style="font-size:28px">7</b><br><span class="muted">默认数据类型</span></div><div class="stat"><b style="font-size:28px">100%</b><br><span class="muted">任务留痕</span></div></div></div><div class="panel login"><h2>登录导账系统</h2><p class="muted">登录后再分别授权源财务软件和新财务软件。</p><div class="grid"><label>账号<br><input id="account" value="migration_admin" style="width:100%"></label><label>密码<br><input type="password" value="123456" style="width:100%"></label><button class="btn" onclick="showWork()">登录</button></div></div></section><main id="work" class="work page"><div class="row" style="justify-content:space-between"><div><span class="tag">导账工作台</span><h1>账套导入任务</h1><p class="muted">从任务列表发起采集，完成后选择数据导入新系统。</p></div><button class="btn" onclick="startTask()">发起导账任务</button></div><div class="layout"><section class="panel main"><div class="steps"><div class="step active" id="s1">任务列表</div><div class="step" id="s2">源授权</div><div class="step" id="s3">异步采集</div><div class="step" id="s4">目标授权</div><div class="step" id="s5">数据导入</div><div class="step" id="s6">完成</div></div><div id="content"></div></section><aside class="panel side"><h3>导入记录</h3><p class="muted" id="sideText">当前暂无新导入记录。</p><div id="records"></div></aside></div></main><script>let step=1;const items=['财务初始余额','会计科目','凭证记录','辅助核算','销项发票','进项发票','工资'];function showWork(){login.style.display='none';work.style.display='block';renderList()}function setStep(n){step=n;for(let i=1;i<=6;i++)document.getElementById('s'+i).classList.toggle('active',i===n)}function renderList(){setStep(1);content.innerHTML='<h2>我的导账任务</h2><table><tr><th>任务</th><th>源系统</th><th>目标系统</th><th>状态</th><th>操作</th></tr><tr><td>成都安骐喜达服饰</td><td>猪哥云</td><td>财税合规AI服务系统</td><td class="status warn">待导入</td><td><button class="btn secondary" onclick="authTarget()">继续导入</button></td></tr><tr><td>上海澜序智能</td><td>财税合规AI服务系统</td><td>猪哥云</td><td class="status ok">导入成功</td><td><button class="btn ghost">查看记录</button></td></tr></table>'}function startTask(){setStep(2);content.innerHTML='<h2>源财务软件授权</h2><p class="muted">选择要采集的财务软件并输入商户/服务商账号。</p><div class="grid" style="max-width:520px"><select><option>猪哥云</option><option>财税合规AI服务系统</option></select><input value="成都服务商"><input value="source_admin"><input type="password" value="123456"><button class="btn" onclick="collect()">提交并开始采集</button></div>'}function collect(){setStep(3);content.innerHTML='<h2>异步采集任务</h2><div class="log" id="log">[10:20] 权限校验通过
[10:20] 正在发现账套...
</div><br><button class="btn secondary" onclick="authTarget()">模拟采集完成</button>';let lines=['[10:21] 发现 3 个企业账套','[10:21] 采集凭证 1280 条','[10:21] 采集发票 832 张','[10:22] 采集完成，等待目标授权'];let i=0;let t=setInterval(()=>{if(i<lines.length){log.textContent+='
'+lines[i++];log.scrollTop=999}else clearInterval(t)},600)}function authTarget(){setStep(4);sideText.textContent='已采集 7 类数据，可进入目标系统授权。';content.innerHTML='<h2>目标财务软件授权</h2><div class="grid" style="max-width:520px"><select><option>财税合规AI服务系统</option><option>猪哥云</option></select><input value="目标服务商"><input value="target_admin"><input type="password" value="123456"><button class="btn" onclick="selectData()">授权通过，选择导入数据</button></div>'}function selectData(){setStep(5);content.innerHTML='<h2>选择导入方式和数据</h2><div class="row"><label><input type="radio" name="mode" checked> 跳过已创建账套企业</label><label><input type="radio" name="mode"> 覆盖已创建账套企业</label></div><div class="grid items">'+items.map(x=>'<label class="item"><input type="checkbox" checked>'+x+'<br><span class="muted">采集成功，可导入</span></label>').join('')+'</div><br><button class="btn" onclick="finish()">导入所选数据</button>'}function finish(){setStep(6);content.innerHTML='<h2>导入成功</h2><p class="status ok">已创建导入任务 MIG-20260612-001，7 类数据导入完成。</p><button class="btn secondary" onclick="renderList()">返回任务列表</button>';records.innerHTML='<div class="item"><b>MIG-20260612-001</b><br><span class="muted">跳过已创建企业 · 7 类数据 · 刚刚</span></div>';sideText.textContent='最新导入记录已生成，可用于审计追溯。'}</script></body></html>
