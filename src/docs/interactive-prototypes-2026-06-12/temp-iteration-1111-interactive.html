<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临时迭代 1.11.1 - 交互原型</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}.page{min-height:100vh;padding:24px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:10px;box-shadow:0 12px 30px rgba(17,24,39,.06)}.btn{border:0;border-radius:8px;background:#7566f1;color:#fff;padding:10px 16px;cursor:pointer;font-weight:700}.btn.secondary{background:#eef2ff;color:#5145cd}.btn.ghost{background:#fff;color:#475467;border:1px solid #d8dee9}.tag{display:inline-flex;border-radius:999px;background:#eef2ff;color:#5145cd;padding:3px 9px;font-size:12px;font-weight:700}.muted{color:#667085}.grid{display:grid;gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{border:1px solid #d8dee9;border-radius:8px;padding:9px 10px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}th{background:#f8fafc;color:#475467}.status{font-weight:700}.ok{color:#0f9f6e}.warn{color:#d97706}.bad{color:#d92d20}.layout{display:grid;grid-template-columns:250px 1fr 420px;min-height:100vh}.nav{background:#fff;border-right:1px solid #e4e8f0;padding:16px}.main{padding:22px}.detail{background:#fff;border-left:1px solid #e4e8f0;padding:22px}.nav button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:10px;border-radius:8px;cursor:pointer;color:#344054}.nav button.active{background:#eef2ff;color:#5145cd}.req{border:1px solid #e4e8f0;border-radius:10px;background:#fff;padding:14px;margin:10px 0;cursor:pointer}.req.active{border-color:#7566f1;box-shadow:inset 3px 0 0 #7566f1}.filters{display:flex;gap:8px;align-items:center}.filters button{border:1px solid #d8dee9;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.filters button.active{background:#eef2ff;color:#5145cd}.metric{padding:18px}.metrics{grid-template-columns:repeat(4,1fr)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.detail,.nav{border:0}}</style></head><body><main class="layout"><aside class="nav"><h2>需求树</h2><p class="muted">Axure 26 页抽取</p><button class="active" onclick="setTheme('全部主题',this)">全部主题 <b>13</b></button><button onclick="setTheme('工资表导入',this)">工资表导入优化 <b>1</b></button><button onclick="setTheme('确税',this)">国税/个税分别确税 <b>3</b></button><button onclick="setTheme('无需申报',this)">电子税务局无需申报 <b>2</b></button><button onclick="setTheme('合规记账',this)">合规记账 <b>1</b></button></aside><section class="main"><div class="row" style="justify-content:space-between"><div><span class="tag">PD001 / v1.11.1 / 曹议</span><h1>临时迭代 1.11.1</h1><p class="muted">业财税合规&专业生产系统需求评审</p></div><button class="btn">打开 Axure 原型</button></div><div class="grid metrics"><div class="panel metric"><span class="muted">需求项</span><h2>13</h2></div><div class="panel metric"><span class="muted">开发就绪</span><h2>5</h2></div><div class="panel metric"><span class="muted">需联调</span><h2>5</h2></div><div class="panel metric"><span class="muted">参考截图</span><h2>12</h2></div></div><div class="filters" style="margin:14px 0"><input id="q" oninput="render()" placeholder="搜索标题、页面、规则或影响范围" style="flex:1"><button class="active" onclick="setStatus('全部',this)">全部</button><button onclick="setStatus('待评审',this)">待评审</button><button onclick="setStatus('设计确认',this)">设计确认</button><button onclick="setStatus('开发就绪',this)">开发就绪</button><button onclick="setStatus('需联调',this)">需联调</button></div><div id="list"></div></section><aside class="detail" id="detail"></aside></main><script>const data=[['工资表姓名前后空格自动忽略','工资表导入','开发就绪','工资表导入','工资表导入时，若姓名前后存在空格，系统应忽略空格并允许导入成功。'],['申报数据汇总拆分国税/个税确税状态','确税','需联调','申报数据汇总','增加国税、个税确税反馈状态，支持待反馈、待确税、已确认可扣、税款存疑、无需确税等状态。'],['国税税金确认事项','确税','设计确认','事项中心','右栏增加完税截图并支持预览。'],['个税税金确认事项','确税','设计确认','事项中心','工资薪金税额后增加申报明细附件下载。'],['电子税务局增加无需申报','无需申报','待评审','电子税务局','新增申报开通字段，联动多个申报页面。'],['记账系统跳转增加个税/社保入口','无需申报','开发就绪','记账系统','未开通时阻断提示，已开通按账期和区域规则跳转。'],['合规记账数量为0无需生成凭证','合规记账','开发就绪','合规记账','数量为0且状态已完成时，凭证状态直接为无需生成，不触发 agent。']].map((x,i)=>({id:i+1,title:x[0],theme:x[1],status:x[2],module:x[3],summary:x[4]}));let theme='全部主题',status='全部',selected=data[0];function setTheme(t,btn){theme=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}function setStatus(s,btn){status=s;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}function pick(id){selected=data.find(x=>x.id===id);renderDetail();document.querySelectorAll('.req').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===id))}function render(){let kw=q.value.trim();let rows=data.filter(x=>(theme==='全部主题'||x.theme===theme)&&(status==='全部'||x.status===status)&&(!kw||(x.title+x.module+x.summary).includes(kw)));list.innerHTML=rows.map(x=>'<div data-id="'+x.id+'" class="req '+(x.id===selected.id?'active':'')+'" onclick="pick('+x.id+')"><div class="row" style="justify-content:space-between"><span class="tag">'+x.status+'</span><span class="muted">'+x.theme+'</span></div><h3>'+x.title+'</h3><p class="muted">'+x.summary+'</p><span class="tag">'+x.module+'</span></div>').join('')||'<p class="muted">没有匹配的需求。</p>'; if(!rows.includes(selected)&&rows[0]) selected=rows[0]; renderDetail()}function renderDetail(){detail.innerHTML='<span class="tag">'+selected.status+'</span><h2>'+selected.title+'</h2><p class="muted">'+selected.theme+' / '+selected.module+'</p><div class="panel" style="padding:14px;margin:14px 0"><h3>需求摘要</h3><p>'+selected.summary+'</p></div><div class="panel" style="padding:14px;margin:14px 0"><h3>关键规则</h3><ul><li>规则需覆盖历史数据兼容。</li><li>字段前后空格应按口径处理。</li><li>异常状态需给出可执行提示。</li></ul></div><div class="panel" style="padding:14px"><h3>验收关注</h3><p>按搜索、筛选、状态切换和详情联动进行评审。</p></div>'}render()</script></body></html>
